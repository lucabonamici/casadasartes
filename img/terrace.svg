<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="60%" stop-color="#2d2822"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <pattern id="cobble" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1a1612"/>
      <circle cx="20" cy="20" r="2" fill="#3a332b"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <rect y="500" width="1200" height="300" fill="url(#cobble)"/>
  <!-- umbrella -->
  <g transform="translate(300 280)">
    <path d="M-180 0 Q0 -120 180 0 Z" fill="#f4f2ec"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#2a2620" stroke-width="3"/>
    <text x="0" y="-40" text-anchor="middle" fill="#8a1a1a" font-family="Georgia" font-size="22" font-weight="bold">SAGRES</text>
  </g>
  <g transform="translate(700 300)">
    <path d="M-180 0 Q0 -120 180 0 Z" fill="#f4f2ec"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#2a2620" stroke-width="3"/>
  </g>
  <!-- warm lights -->
  <circle cx="280" cy="180" r="4" fill="#ffd89e" opacity="0.9"/>
  <circle cx="380" cy="200" r="4" fill="#ffd89e" opacity="0.9"/>
  <circle cx="480" cy="180" r="4" fill="#ffd89e" opacity="0.9"/>
  <circle cx="680" cy="190" r="4" fill="#ffd89e" opacity="0.9"/>
  <circle cx="780" cy="210" r="4" fill="#ffd89e" opacity="0.9"/>
  <circle cx="880" cy="190" r="4" fill="#ffd89e" opacity="0.9"/>
  <!-- tables -->
  <rect x="200" y="560" width="80" height="50" fill="#0a0908" stroke="#3a332b"/>
  <rect x="340" y="580" width="80" height="50" fill="#0a0908" stroke="#3a332b"/>
  <rect x="600" y="580" width="80" height="50" fill="#0a0908" stroke="#3a332b"/>
  <rect x="820" y="560" width="80" height="50" fill="#0a0908" stroke="#3a332b"/>
</svg>
